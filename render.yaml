services:
  - type: web
    name: burkut-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: AGENT_TOKEN
        sync: false
